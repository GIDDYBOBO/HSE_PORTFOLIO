    <script>
      // Suppress benign third-party browser extension errors (such as MetaMask or other Web3 wallets)
      (function() {
        var isExtensionError = function(msg, src) {
          var str = (msg || '').toString().toLowerCase();
          var source = (src || '').toString().toLowerCase();
          return (
            str.indexOf('metamask') !== -1 ||
            str.indexOf('ethereum') !== -1 ||
            str.indexOf('failed to connect') !== -1 ||
            source.indexOf('chrome-extension://') !== -1 ||
            source.indexOf('moz-extension://') !== -1 ||
            source.indexOf('inpage.js') !== -1
          );
        };

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = reason ? (reason.message || reason.stack || reason) : '';
          if (isExtensionError(msg, '')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isExtensionError(event.message, event.filename)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
